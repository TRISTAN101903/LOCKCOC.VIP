name: Build APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Dia chi Render, vd https://ten.onrender.com"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: LockCOC
        env:
          APP_URL: ${{ inputs.url }}
        run: bash build_apk.sh "$APP_URL"
      - name: Dua APK vao web va push
        run: |
          mkdir -p LockCOC/static/downloads
          mv LockCOC/LockCOC.apk LockCOC/static/downloads/LockCOC.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f LockCOC/static/downloads/LockCOC.apk
          git commit -m "cap nhat LockCOC.apk"
          git push
